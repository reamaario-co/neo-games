<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO GAMES | Snake</title>
<style>
:root{--cyan:#55ddff;--bg:#090e1b;--panel:#111a2c;--muted:#aab8d0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(ellipse at top,#182945 0,#090e1b 65%);color:#f1f5ff;font-family:Arial,Helvetica,sans-serif}
.app{width:100%;max-width:1050px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-size:clamp(25px,4vw,38px);font-weight:900;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 14px #00cfff66}
.subtitle{font-size:12px;letter-spacing:2px;color:#9eb5d3;margin-top:4px}
a,button{font:inherit}button,.
back{display:inline-block;background:#121e33;color:#eafaff;border:1px solid #31516d;border-radius:9px;padding:11px 15px;font-weight:700;text-decoration:none;cursor:pointer}
button:hover,.back:hover{border-color:var(--cyan);box-shadow:0 0 10px #00cfff33}
button.primary{background:#083d50;border-color:var(--cyan)}
.panel{padding:16px;background:#0d1525;border:1px solid #263951;border-radius:16px;box-shadow:0 10px 30px #0005}
.hud{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{min-width:100px;padding:9px 13px;background:#111e32;border:1px solid #263951;border-radius:9px;color:var(--muted);font-size:13px}
.stat strong{display:block;color:#fff;font-size:20px;margin-top:2px}
.board{width:100%;max-width:800px;margin:0 auto;border:1px solid #2d5267;border-radius:12px;overflow:hidden;background:#07111c;box-shadow:0 0 22px #00cfff14}
canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.controls button{min-width:54px;font-size:20px;padding:10px 16px}
.hint{text-align:center;color:var(--muted);font-size:13px;line-height:1.6;margin:14px 0 2px}
@media(max-width:560px){body{padding:8px}.panel{padding:9px}.stat{min-width:82px}.controls button{min-width:48px;padding:10px 13px}}
.back {
  display: inline-block;
  background: #121e33;
  color: #eafaff;
  border: 1px solid #31516d;
  border-radius: 9px;
  padding: 11px 15px;
  font-weight: 700;
  text-decoration: none;
   cursor: pointer;
}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="brand">NEO<span style="color:#fff"> GAMES</span></div><div class="subtitle">SNAKE • KOGU TOITU JA PUNKTE</div></div>
  <a class="back" href="index.html">← Mängude avaleht</a>
</header>
<section class="panel">
  <div class="hud">
    <div class="stats"><div class="stat">PUNKTID<strong id="score">0</strong></div><div class="stat">REKORD<strong id="best">0</strong></div></div>
    <div><button class="primary" id="startBtn">Alusta mängu</button> <button id="pauseBtn">Paus</button></div>
  </div>
  <div class="board"><canvas id="game" width="600" height="600" aria-label="Snake mänguväli"></canvas></div>
  <div class="controls" aria-label="Ussi juhtimine">
    <button data-dir="up" aria-label="Üles">↑</button>
    <button data-dir="left" aria-label="Vasakule">←</button>
    <button data-dir="down" aria-label="Alla">↓</button>
    <button data-dir="right" aria-label="Paremale">→</button>
  </div>
  <p class="hint" id="message">Vajuta „Alusta mängu”. Juhi ussi nooleklahvidega või ekraaninuppudega. Kogu heledaid toidupunkte ja väldi seina ning iseendaga kokkupõrget.</p>
</section>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),messageEl=document.getElementById('message');
const startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn');
const cells=25,cell=canvas.width/cells;
let snake,food,dir,nextDir,score,best=0,running=false,paused=false,over=false,last=0,acc=0;
try{best=Number(localStorage.getItem('neoSnakeBest')||0)}catch(e){}bestEl.textContent=best;
function placeFood(){let p;do{p={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p}
function reset(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;scoreEl.textContent=score;running=true;paused=false;over=false;acc=0;placeFood();messageEl.textContent='Mäng käib! Kogu toitu ja väldi kokkupõrkeid.';pauseBtn.textContent='Paus';draw()}
function setDirection(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(!d)return;if(d.x===-dir.x&&d.y===-dir.y)return;nextDir=d}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)){running=false;over=true;messageEl.textContent='Mäng läbi! Sinu punktid: '+score+'. Vajuta „Alusta mängu”, et uuesti proovida.';draw();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neoSnakeBest',String(best))}catch(e){}}placeFood()}else snake.pop()}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.fillStyle='#07111c';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#15263a';ctx.lineWidth=1;for(let i=0;i<=cells;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,600);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(600,i*cell);ctx.stroke()}
  if(food){ctx.save();ctx.shadowColor='#ff4fd8';ctx.shadowBlur=18;ctx.fillStyle='#ff4fd8';ctx.beginPath();ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.32,0,Math.PI*2);ctx.fill();ctx.restore()}
  snake?.forEach((s,i)=>{ctx.save();ctx.shadowColor=i===0?'#55ddff':'#20cfa5';ctx.shadowBlur=i===0?14:5;ctx.fillStyle=i===0?'#b5f5ff':'#20cfa5';rounded(s.x*cell+2,s.y*cell+2,cell-4,cell-4,5);ctx.fill();ctx.restore()});
  if(!running||paused){ctx.fillStyle='#050914b8';ctx.fillRect(0,0,600,600);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#55ddff';ctx.font='bold 30px Arial';ctx.fillText(over?'MÄNG LÄBI':paused?'PAUS':'SNAKE',300,275);ctx.fillStyle='#f1f5ff';ctx.font='16px Arial';ctx.fillText(over?'Proovi uuesti!':paused?'Vajuta jätkamiseks Paus':'Vajuta Alusta mängu',300,312)}}
function frame(ts){if(!last)last=ts;const dt=Math.min(ts-last,50);last=ts;if(running&&!paused){acc+=dt;const speed=Math.max(65,135-score*.35);while(acc>=speed){tick();acc-=speed;if(!running)break}}draw();requestAnimationFrame(frame)}
startBtn.addEventListener('click',reset);pauseBtn.addEventListener('click',()=>{if(!running&& !paused)return;paused=!paused;pauseBtn.textContent=paused?'Jätka':'Paus';messageEl.textContent=paused?'Mäng on pausil.':'Mäng jätkub.';draw()});
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};if(map[e.key]){e.preventDefault();setDirection(map[e.key])}if(e.key===' '){e.preventDefault();if(running||paused){paused=!paused;pauseBtn.textContent=paused?'Jätka':'Paus'}}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDirection(b.dataset.dir)));
reset();running=false;messageEl.textContent='Vajuta „Alusta mängu”. Juhi ussi nooleklahvidega või all olevate nuppudega.';draw();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
