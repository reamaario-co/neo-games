
<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUNNER | NEO GAMES</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b18;color:#eafaff;font-family:Arial,sans-serif;text-align:center}
header{padding:20px}
h1{color:#00f5ff;text-shadow:0 0 16px #00dfff;letter-spacing:4px}
.game{max-width:900px;margin:auto;padding:12px}
canvas{width:100%;background:#090e24;border:2px solid #00eaff;border-radius:12px;box-shadow:0 0 22px #00bfff55;display:block;touch-action:manipulation}
.stats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin:14px 0}
.stat{background:#101a33;border:1px solid #00dfff66;border-radius:10px;padding:12px;min-width:100px}
.stat span{display:block;color:#00f5ff;font-size:23px;font-weight:bold;margin-top:5px}
button{background:#0b2038;color:#00f5ff;border:1px solid #00eaff;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:5px}
button:hover{background:#123b55;box-shadow:0 0 12px #00dfff66}
#message{min-height:28px;color:#ff69dc;font-weight:bold}
p{color:#a8bdd7;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>NEON RUNNER</h1>
<div>JOOKSE. HÜPPA. ELA ÜLE.</div>
</header>

<div class="game">
<div class="stats">
<div class="stat">PUNKTID<span id="score">0</span></div>
<div class="stat">MÜNDID<span id="coins">0</span></div>
<div class="stat">REKORD<span id="best">0</span></div>
</div>

<canvas id="game" width="850" height="400"></canvas>

<div>
<button id="start">▶ ALUSTA / UUESTI</button>
<button id="pause">Ⅱ PAUS</button>
<button id="sound">🔊 HELI SEES</button>
</div>
<div id="message">Vajuta ALUSTA ja hüppa takistustest üle!</div>
<p>Arvuti: tühik / ↑ / W = hüppa. Telefonis: puuduta mänguvälja.</p>
<p><a href="index.html" style="color:#00f5ff">← TAGASI MÄNGUDE AVALEHELE</a></p>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const bestEl=document.getElementById("best");
const message=document.getElementById("message");

let running=false,paused=false,over=false;
let score=0,coins=0,speed=5,frame=0;
let obstacles=[],coinItems=[],particles=[];
let soundOn=true,audio=null;
let best=0;
try{best=Number(localStorage.getItem("neonRunnerBest"))||0}catch(e){}
bestEl.textContent=best;

const ground=330;
const player={x:100,y:ground-48,w:34,h:48,vy:0,jumping:false};

function beep(freq=500,duration=0.07){
 if(!soundOn)return;
 try{
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.frequency.value=freq;osc.type="sine";
  gain.gain.value=0.035;
  osc.connect(gain);gain.connect(audio.destination);
  osc.start();gain.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+duration);
  osc.stop(audio.currentTime+duration);
 }catch(e){}
}

function reset(){
 score=0;coins=0;speed=5;frame=0;
 obstacles=[];coinItems=[];particles=[];
 player.y=ground-player.h;player.vy=0;player.jumping=false;
 running=true;paused=false;over=false;
 scoreEl.textContent=score;coinsEl.textContent=coins;
 message.textContent="Jookse! Kogu münte ja väldi takistusi!";
 document.getElementById("pause").textContent="Ⅱ PAUS";
}

function jump(){
 if(!running||paused||over)return;
 if(!player.jumping){
  player.vy=-13.5;player.jumping=true;beep(650);
 }
}

function burst(x,y,color){
 for(let i=0;i<9;i++){
  particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,life:25,color});
 }
}

function rectHit(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function endGame(){
 running=false;over=true;beep(130,.25);
 message.textContent="MÄNG LÄBI! Sinu tulemus: "+score+". Vajuta ALUSTA ja proovi uuesti.";
 if(score>best){
  best=score;bestEl.textContent=best;
  try{localStorage.setItem("neonRunnerBest",best)}catch(e){}
  message.textContent="UUS REKORD! "+score+" punkti! Vajuta uuesti mängimiseks ALUSTA.";
 }
}

function drawBackground(){
 ctx.fillStyle="#090e24";ctx.fillRect(0,0,850,400);
 for(let i=0;i<45;i++){
  const x=(i*197-frame*.35%850+850)%850;
  const y=(i*67)%260;
  ctx.fillStyle="#7eafff";ctx.globalAlpha=.3+(i%3)*.2;
  ctx.fillRect(x,y,2,2);
 }
 ctx.globalAlpha=1;
 // Neon city
 for(let i=0;i<12;i++){
  let x=(i*100-frame*.5%100+850)%850;
  let h=40+(i*37)%100;
  ctx.fillStyle="#101a39";ctx.fillRect(x,ground-h,55,h);
  ctx.fillStyle="#00dfff";
  for(let wy=ground-h+10;wy<ground-8;wy+=16)
   for(let wx=x+9;wx<x+50;wx+=16){
    ctx.globalAlpha=.35;ctx.fillRect(wx,wy,5,6);
   }
 }
 ctx.globalAlpha=1;
 ctx.fillStyle="#00eaff";ctx.shadowColor="#00eaff";ctx.shadowBlur=16;
 ctx.fillRect(0,ground,850,3);ctx.shadowBlur=0;
 for(let i=0;i<18;i++){
  let x=(i*70-frame*speed%70+850)%850;
  ctx.fillStyle="#263b62";ctx.fillRect(x,ground+24,35,3);
 }
}

function drawPlayer(){
 ctx.save();
 ctx.shadowColor="#00f5ff";ctx.shadowBlur=20;
 ctx.fillStyle="#00eaff";
 ctx.fillRect(player.x,player.y+8,player.w,player.h-8);
 ctx.fillStyle="#ffffff";ctx.fillRect(player.x+19,player.y+16,7,7);
 ctx.fillStyle="#ff48d5";ctx.fillRect(player.x+5,player.y+player.h-4,10,7);
 ctx.fillRect(player.x+23,player.y+player.h-4,10,7);
 ctx.restore();
}

function drawObstacle(o){
 ctx.save();ctx.shadowColor="#ff3c91";ctx.shadowBlur=15;
 ctx.fillStyle="#ff287f";ctx.fillRect(o.x,o.y,o.w,o.h);
 ctx.strokeStyle="#ffd2ed";ctx.strokeRect(o.x+4,o.y+4,o.w-8,o.h-8);
 ctx.restore();
}

function drawCoin(c){
 ctx.save();ctx.shadowColor="#ffe66d";ctx.shadowBlur=18;
 ctx.fillStyle="#ffdb4d";ctx.beginPath();
 ctx.arc(c.x,c.y,9,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff5bb";ctx.fillRect(c.x-2,c.y-5,4,10);
 ctx.restore();
}

function update(){
 if(running&&!paused&&!over){
  frame++;score+=1;speed=5+Math.min(score/350,7);
  scoreEl.textContent=score;

  player.vy+=.62;player.y+=player.vy;
  if(player.y>=ground-player.h){
   player.y=ground-player.h;player.vy=0;player.jumping=false;
  }

  if(frame%Math.max(35,Math.floor(88-speed*3))===0){
   const h=30+Math.random()*30;
   obstacles.push({x:870,y:ground-h,w:24+Math.random()*16,h});
  }
  if(frame%95===0){
   coinItems.push({x:870,y:ground-65-Math.random()*100,r:10});
  }

  obstacles.forEach(o=>o.x-=speed);
  coinItems.forEach(c=>c.x-=speed);
  obstacles=obstacles.filter(o=>o.x+o.w>0);
  coinItems=coinItems.filter(c=>c.x>-20);

  for(const o of obstacles){
   if(rectHit({x:player.x+4,y:player.y+4,w:player.w-8,h:player.h-5},o)){
    endGame();break;
   }
  }
  if(running){
   coinItems=coinItems.filter(c=>{
    if(Math.hypot(player.x+player.w/2-c.x,player.y+player.h/2-c.y)<27){
     coins++;coinsEl.textContent=coins;score+=50;
     scoreEl.textContent=score;beep(950);burst(c.x,c.y,"#ffdb4d");
     return false;
    }
    return true;
   });
  }
 }
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});
 particles=particles.filter(p=>p.life>0);
}

function draw(){
 drawBackground();
 coinItems.forEach(drawCoin);
 obstacles.forEach(drawObstacle);
 drawPlayer();
 particles.forEach(p=>{
  ctx.globalAlpha=p.life/25;ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,4,4);
 });
 ctx.globalAlpha=1;
 if(!running||paused||over){
  ctx.fillStyle="#05091bcc";ctx.fillRect(190,140,470,90);
  ctx.textAlign="center";
  ctx.fillStyle="#00f5ff";ctx.font="bold 28px Arial";
  ctx.fillText(paused?"PAUS":over?"MÄNG LÄBI":"VALMIS?",425,178);
  ctx.fillStyle="#ffffff";ctx.font="16px Arial";
  ctx.fillText(paused?"Vajuta JÄTKA":"Vajuta ALUSTA",425,207);
 }
}

function loop(){update();draw();requestAnimationFrame(loop)}
document.getElementById("start").addEventListener("click",reset);
document.getElementById("pause").addEventListener("click",()=>{
 if(!running&&!paused)return;
 paused=!paused;
 if(paused){running=false;message.textContent="Mäng on pausil."}
 else{running=true;message.textContent="Jätkame!";}
 document.getElementById("pause").textContent=paused?"▶ JÄTKA":"Ⅱ PAUS";
});
document.getElementById("sound").addEventListener("click",e=>{
 soundOn=!soundOn;e.target.textContent=soundOn?"🔊 HELI SEES":"🔇 HELI VÄLJAS";
 if(soundOn)beep(700);
});
document.addEventListener("keydown",e=>{
 if(["Space","ArrowUp","KeyW"].includes(e.code)){
  e.preventDefault();jump();
 }
});
canvas.addEventListener("pointerdown",jump);
draw();loop();
</script>
</body>
</html>
